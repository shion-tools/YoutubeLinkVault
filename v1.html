<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Link Vault</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#181c25;--panel2:#202633;--line:#303848;--muted:#9aa6b7;--text:#f4f6fb;--red:#ff4545;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px}button:hover{border-color:var(--accent)}button.primary{background:#d92f38;border-color:#d92f38}button.ghost{background:transparent}
header{height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#11141bee;backdrop-filter:blur(12px);z-index:5}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px}.logo span{color:#ff555d}.topsearch{max-width:520px;flex:1;margin:auto}.topsearch input{width:100%}
input,select{background:#10141c;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}input:focus,select:focus{border-color:var(--accent)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}
aside{border-right:1px solid var(--line);padding:20px 14px;background:#131720}.navlabel{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;padding:12px 10px 6px}.nav button{display:flex;width:100%;justify-content:space-between;background:transparent;border-color:transparent;text-align:left;margin:2px 0}.nav button.active{background:#252d3b;border-color:#343f52}.count{color:var(--muted)}
main{padding:24px;max-width:1500px;width:100%;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.heading h1{font-size:23px;margin:0}.sub{color:var(--muted);margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#252b36;display:block}.cardbody{padding:12px}.cardtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px}.cardactions{display:flex;gap:6px;margin-top:11px}.cardactions button{padding:6px 9px;font-size:12px}.star{color:#ffd166}
.empty{border:1px dashed #3b4658;border-radius:14px;padding:42px 20px;text-align:center;color:var(--muted)}
.player{background:#080a0e;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}.playerhead{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:var(--panel)}.playerframe{aspect-ratio:16/9;max-height:70vh}.playerframe iframe{width:100%;height:100%;border:0}.playerplaceholder{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px}
.modalback{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:10}.modalback.show{display:grid}.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}.modal h2{margin:0 0 15px}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:12px}.modal input,.modal select{width:100%}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{display:flex;overflow:auto}.navlabel{display:none}.nav button{white-space:nowrap;width:auto}.count{display:none}main{padding:16px}.heading{align-items:flex-start}.topsearch{max-width:none}header{padding:0 12px}.logo{font-size:15px}}
</style>
</head>
<body>
<header><div class="logo"><span>▶</span> YouTube Link Vault</div><div class="topsearch"><input id="globalSearch" placeholder="動画を検索..." aria-label="動画を検索"></div><button class="primary" id="openAdd">＋ 動画を追加</button></header>
<div class="layout">
<aside><div class="navlabel">LIBRARY</div><nav class="nav" id="nav">
<button class="active" data-view="all">すべての動画 <span class="count" id="allCount">0</span></button>
<button data-view="favorites">★ お気に入り</button><button data-view="playlists">▤ プレイリスト</button><button data-view="history">◷ 再生履歴</button>
</nav><div class="navlabel">FOLDERS</div><nav class="nav" id="folderNav"></nav><div style="padding:8px"><button class="ghost" id="newFolder" style="width:100%">＋ フォルダを作成</button></div></aside>
<main>
<section class="player"><div class="playerhead"><div><strong id="nowTitle">再生する動画を選択してください</strong><div class="meta" id="nowMeta">選択した動画がここで再生されます</div></div><button class="ghost" id="stopPlayer">プレイヤーを閉じる</button></div><div class="playerframe" id="playerFrame"><div class="playerplaceholder"><div style="font-size:38px;color:#ff4545">▶</div><strong>YouTube Player</strong><span>ライブラリから動画を選択</span></div></div></section>
<div class="heading"><div><h1 id="viewTitle">すべての動画</h1><div class="sub" id="viewSub">保存したYouTubeリンクを管理</div></div><button id="sortBtn">追加が新しい順 ↓</button></div>
<div id="playlistTools" style="display:none" class="toolbar"><input id="playlistName" placeholder="新しいプレイリスト名"><button id="createPlaylist" class="primary">作成</button></div>
<div class="toolbar"><input id="localSearch" placeholder="この一覧を検索..."><select id="folderFilter"><option value="">すべてのフォルダ</option></select></div>
<div class="grid" id="videoGrid"></div><div id="empty" class="empty" style="display:none">まだ動画がありません。<br>「動画を追加」からYouTubeのURLを保存できます。</div>
</main></div>
<div class="modalback" id="addModal"><div class="modal"><h2>動画リンクを追加</h2><div class="field"><label>YouTube URL</label><input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>タイトル（任意）</label><input id="videoTitle" placeholder="空欄なら動画IDを仮タイトルにします"></div><div class="field"><label>フォルダ</label><select id="videoFolder"></select></div><div class="field"><label>プレイリスト（任意）</label><select id="videoPlaylist"><option value="">追加しない</option></select></div><div class="notice">保存するのはリンクと管理情報です。動画ファイル自体は保存しません。</div><div class="modalfoot"><button id="cancelAdd">キャンセル</button><button class="primary" id="saveVideo">保存</button></div></div></div>
<script>
const KEY='ylv_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{videos:[],folders:['未分類'],playlists:[],history:[]};
let view='all',folderView='',sortNewest=true,activePlaylist='';
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseId(raw){try{let u=new URL(raw);if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.endsWith('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]}}catch(e){}return null}
function openModal(){ $('addModal').classList.add('show'); $('videoUrl').focus() }
function closeModal(){ $('addModal').classList.remove('show') }
function fillSelects(){ $('videoFolder').innerHTML=db.folders.map(f=>`<option>${esc(f)}</option>`).join('');$('folderFilter').innerHTML='<option value="">すべてのフォルダ</option>'+db.folders.map(f=>`<option>${esc(f)}</option>`).join('');$('videoPlaylist').innerHTML='<option value="">追加しない</option>'+db.playlists.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
function addVideo(){let id=parseId($('videoUrl').value.trim());if(!id){alert('有効なYouTube URLを入力してください。');return}if(db.videos.some(v=>v.id===id)){alert('この動画はすでに保存されています。');return}let title=$('videoTitle').value.trim()||'YouTube動画 '+id;let v={id,url:'https://www.youtube.com/watch?v='+id,title,folder:$('videoFolder').value||'未分類',favorite:false,added:Date.now()};db.videos.unshift(v);let pl=$('videoPlaylist').value;if(pl){let p=db.playlists.find(x=>x.id===pl);if(p)p.videoIds.push(id)}$('videoUrl').value='';$('videoTitle').value='';closeModal();persist()}
function currentVideos(){let arr=[...db.videos],q=($('globalSearch').value+' '+$('localSearch').value).trim().toLowerCase();if(view==='favorites')arr=arr.filter(v=>v.favorite);if(view==='history'){let ids=[...new Set(db.history.map(h=>h.id))];arr=ids.map(id=>db.videos.find(v=>v.id===id)).filter(Boolean)}if(view==='folder')arr=arr.filter(v=>v.folder===folderView);if(view==='playlist'){let p=db.playlists.find(x=>x.id===activePlaylist);arr=(p?.videoIds||[]).map(id=>db.videos.find(v=>v.id===id)).filter(Boolean)}if(view==='playlists')arr=[];if(view==='all'&&$('folderFilter').value)arr=arr.filter(v=>v.folder===$('folderFilter').value);if(q)arr=arr.filter(v=>(v.title+' '+v.id+' '+v.folder).toLowerCase().includes(q));return arr}
function render(){fillSelects();$('allCount').textContent=db.videos.length;$('folderNav').innerHTML=db.folders.map(f=>`<button data-folder="${esc(f)}" class="${view==='folder'&&folderView===f?'active':''}">${esc(f)} <span class="count">${db.videos.filter(v=>v.folder===f).length}</span></button>`).join('');let titles={all:'すべての動画',favorites:'お気に入り',playlists:'プレイリスト',history:'再生履歴',folder:folderView,playlist:db.playlists.find(p=>p.id===activePlaylist)?.name||'プレイリスト'};$('viewTitle').textContent=titles[view]||'動画';$('viewSub').textContent=view==='history'?'最近再生した動画':view==='playlists'?'プレイリストを作成して動画を整理':'保存したYouTubeリンクを管理';$('playlistTools').style.display=view==='playlists'?'flex':'none';$('folderFilter').style.display=view==='all'?'':'none';let arr=currentVideos();if(view==='playlists'){$('videoGrid').innerHTML=db.playlists.map(p=>`<article class="card"><div class="cardbody"><div style="font-size:28px">▤</div><div class="cardtitle">${esc(p.name)}</div><div class="meta">${p.videoIds.length} 本の動画</div><div class="cardactions"><button data-openpl="${p.id}" class="primary">開く</button><button data-delpl="${p.id}">削除</button></div></div></article>`).join('');$('empty').style.display=db.playlists.length?'none':'block';$('empty').textContent='まだプレイリストがありません。上から作成できます。';return}if(sortNewest)arr.sort((a,b)=>b.added-a.added);else arr.sort((a,b)=>a.title.localeCompare(b.title,'ja'));$('videoGrid').innerHTML=arr.map(v=>`<article class="card"><img class="thumb" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" onerror="this.style.visibility='hidden'" alt=""><div class="cardbody"><div class="cardtitle" title="${esc(v.title)}">${esc(v.title)}</div><div class="meta">${esc(v.folder)} ・ ${new Date(v.added).toLocaleDateString('ja-JP')}</div><div class="cardactions"><button class="primary" data-play="${v.id}">▶ 再生</button><button data-fav="${v.id}" title="お気に入り">${v.favorite?'★':'☆'}</button><button data-edit="${v.id}">編集</button><button data-del="${v.id}">削除</button></div></div></article>`).join('');$('empty').style.display=arr.length?'none':'block';$('empty').innerHTML=view==='playlists'?'プレイリストを作成するか、動画追加時に登録してください。':'表示できる動画がありません。'}
function play(id){let v=db.videos.find(x=>x.id===id);if(!v)return;$('nowTitle').textContent=v.title;$('nowMeta').textContent='YouTube ・ '+v.id;$('playerFrame').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;db.history.unshift({id,time:Date.now()});db.history=db.history.slice(0,200);localStorage.setItem(KEY,JSON.stringify(db))}
function editVideo(id){let v=db.videos.find(x=>x.id===id);if(!v)return;let t=prompt('動画タイトル',v.title);if(t===null)return;let f=prompt('フォルダ名（既存または新規）',v.folder);if(f===null)return;v.title=t.trim()||v.title;f=f.trim()||'未分類';if(!db.folders.includes(f))db.folders.push(f);v.folder=f;persist()}
$('videoGrid').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.openpl){view='playlist';activePlaylist=b.dataset.openpl;render();return}if(b.dataset.delpl){if(confirm('このプレイリストを削除しますか？')){db.playlists=db.playlists.filter(p=>p.id!==b.dataset.delpl);persist()}return}let id=b.dataset.play||b.dataset.fav||b.dataset.del||b.dataset.edit;if(b.dataset.play)play(id);if(b.dataset.fav){let v=db.videos.find(x=>x.id===id);v.favorite=!v.favorite;persist()}if(b.dataset.del&&confirm('このリンクをライブラリから削除しますか？')){db.videos=db.videos.filter(x=>x.id!==id);db.playlists.forEach(p=>p.videoIds=p.videoIds.filter(x=>x!==id));persist()}if(b.dataset.edit)editVideo(id)});
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;folderView='';activePlaylist='';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('folderNav').addEventListener('click',e=>{let b=e.target.closest('[data-folder]');if(!b)return;view='folder';folderView=b.dataset.folder;activePlaylist='';document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));render()});
$('videoGrid').addEventListener('dblclick',e=>{let c=e.target.closest('.card');if(c){let b=c.querySelector('[data-play]');if(b)play(b.dataset.play)}});
$('openAdd').onclick=openModal;$('cancelAdd').onclick=closeModal;$('saveVideo').onclick=addVideo;$('addModal').addEventListener('click',e=>{if(e.target===$('addModal'))closeModal()});
$('newFolder').onclick=()=>{let n=prompt('フォルダ名');if(!n)return;n=n.trim();if(n&&!db.folders.includes(n)){db.folders.push(n);persist()}};
$('createPlaylist').onclick=()=>{let n=$('playlistName').value.trim();if(!n)return;db.playlists.push({id:crypto.randomUUID(),name:n,videoIds:[]});$('playlistName').value='';persist()};
$('sortBtn').onclick=()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'追加が新しい順 ↓':'タイトル順 A→Z';render()};
$('globalSearch').oninput=render;$('localSearch').oninput=render;$('folderFilter').onchange=render;
$('stopPlayer').onclick=()=>{$('playerFrame').innerHTML='<div class="playerplaceholder"><div style="font-size:38px;color:#ff4545">▶</div><strong>YouTube Player</strong><span>ライブラリから動画を選択</span></div>';$('nowTitle').textContent='再生する動画を選択してください';$('nowMeta').textContent='選択した動画がここで再生されます'};
$('videoGrid').addEventListener('contextmenu',e=>e.preventDefault());
$('nav').addEventListener('dblclick',e=>{let b=e.target.closest('[data-view="playlists"]');if(b&&db.playlists.length){let p=db.playlists[0];view='playlist';activePlaylist=p.id;render()}});
render();
</script>
</body></html>
