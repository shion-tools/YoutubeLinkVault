<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#181d27;--panel2:#202735;--line:#30394a;--text:#f3f5fa;--muted:#9ba7b9;--accent:#ff5964;--blue:#91a9ff;--shadow:0 18px 55px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#252d48 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:var(--panel2);border:1px solid var(--line);padding:9px 12px;border-radius:10px;transition:.16s}button:hover{border-color:#7688bd;transform:translateY(-1px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button.primary{background:linear-gradient(135deg,#fa5361,#db3548);border-color:transparent;color:white;font-weight:700}button.ghost{background:transparent}button.danger{color:#ff9da5}.topbar{height:70px;position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;padding:0 26px;background:#11151eeF;border-bottom:1px solid #ffffff12;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}.brandmark{height:34px;width:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#ff727a,#d52e40);box-shadow:0 5px 20px #f3455540}.brandmark svg{width:17px;fill:white}.topsearch{max-width:560px;flex:1;margin:auto;position:relative}.topsearch input{width:100%;padding-left:38px}.searchicon{position:absolute;top:9px;left:13px;color:var(--muted)}input,select{background:#111620;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}input::placeholder{color:#788499}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{padding:20px 14px;border-right:1px solid #ffffff12;background:#131720a8;display:flex;flex-direction:column;gap:5px}.navlabel{color:#77849a;font-size:10px;font-weight:800;letter-spacing:1.35px;padding:15px 11px 6px}.nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border-color:transparent;margin:2px 0;padding:9px 11px}.nav button.active{background:#293247;border-color:#ffffff10;color:#fff}.nav .icon{width:19px;text-align:center;color:#adb9ce;font-size:15px}.count{margin-left:auto;color:#9ba7b9;font-size:12px}.foldernav{max-height:34vh;overflow:auto}.sidebarbottom{margin-top:auto;border-top:1px solid #ffffff12;padding-top:12px}.databtn{width:100%;display:flex;align-items:center;gap:10px;margin:4px 0;text-align:left;background:transparent;border-color:transparent}.datahint{font-size:11px;color:#748197;padding:5px 10px 0}.themebutton{width:100%;margin-top:12px;text-align:left;background:transparent;border-color:transparent;color:var(--muted)}main{width:100%;max-width:1580px;margin:0 auto;padding:27px 32px 60px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 21px}.heading h1{font-size:25px;letter-spacing:-.4px;margin:0}.sub{color:var(--muted);margin-top:4px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:19px}.toolbar input{flex:1;min-width:190px}.toolbar select{min-width:150px}.sortbtn{white-space:nowrap}.playlistTools{display:flex;gap:8px;margin-bottom:18px}.playlistTools input{max-width:380px;flex:1}.player{background:#080a0f;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:25px;box-shadow:var(--shadow)}.playerhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--panel)}.playerframe{aspect-ratio:16/9;max-height:65vh}.playerframe iframe{width:100%;height:100%;border:0}.playerplaceholder{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}.card{background:linear-gradient(160deg,#1a202b,#171b24);border:1px solid #ffffff12;border-radius:15px;overflow:hidden;min-width:0;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#69799c88;box-shadow:0 12px 30px #0003}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#242b39;display:block}.cardbody{padding:13px}.cardtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px}.cardactions{display:flex;gap:6px;margin-top:12px;align-items:center}.cardactions button{padding:7px 9px;font-size:12px}.cardactions .playbtn{flex:1}.empty{border:1px dashed #3b4658;border-radius:15px;padding:44px 20px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#05070bc9;display:none;place-items:center;padding:18px;z-index:8;backdrop-filter:blur(5px)}.modalback.show{display:grid}.modal{width:min(570px,100%);max-height:92vh;overflow:auto;background:#1a202b;border:1px solid #ffffff1d;border-radius:17px;padding:23px;box-shadow:var(--shadow)}.modal h2{margin:0 0 17px;font-size:19px}.field{display:grid;gap:6px;margin:13px 0}.field label{color:#aab5c6;font-size:12px}.modal input,.modal select{width:100%}.checklist{display:grid;gap:7px;margin-top:8px}.checkrow{display:flex;align-items:center;gap:9px;color:#d3d9e4;background:#111620;padding:9px 10px;border-radius:9px}.checkrow input{width:auto}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.notice{color:var(--muted);font-size:12px;margin-top:10px}.manageactions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.light{color-scheme:light;--bg:#f3f5f9;--panel:#fff;--panel2:#f0f2f7;--line:#dce1ea;--text:#202634;--muted:#667287;background:radial-gradient(ellipse at 75% -15%,#dce4ff 0,transparent 38%),var(--bg)}.light .topbar{background:#ffffffed;border-color:#dfe3ec}.light aside{background:#ffffffaa;border-color:#dfe3ec}.light .nav button.active{background:#e8ecf8;color:#252d40}.light .card{background:#fff;border-color:#dce1ea}.light .playerhead{background:#fff}.light input,.light select{background:#fff}.light .modal{background:#fff}.light .checkrow{background:#f2f4f8;color:#303849}.light .sidebarbottom{border-color:#dce1ea}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ffffff12;padding:8px 12px}.nav{display:flex;overflow:auto}.navlabel,.sidebarbottom{display:none}.nav button{white-space:nowrap;width:auto;flex:none}.count{display:none}main{padding:20px 16px 45px}.topbar{height:62px;padding:0 12px;gap:10px}.brand{font-size:14px}.brandmark{width:30px;height:30px}.topsearch{max-width:none}.topbar>#openAdd{font-size:12px;padding:8px}.heading{align-items:flex-start}.playerframe{max-height:45vh}}@media(max-width:520px){.topsearch{display:none}.topbar{justify-content:space-between}.heading h1{font-size:21px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.cardactions{gap:4px}.cardactions button{padding:6px 7px;font-size:11px}}

<body><header class="topbar"><div class="brand"><span class="brandmark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>YouTube Link Vault</div><div class="topsearch"><span class="searchicon">⌕</span><input id="globalSearch" placeholder="動画を検索..." aria-label="動画を検索"></div><button class="primary" id="openAdd">＋ 動画を追加</button></header>
<div class="layout"><aside><div class="navlabel">LIBRARY</div><nav class="nav" id="nav"><button class="active" data-view="all"><span class="icon">▦</span>すべての動画<span class="count" id="allCount">0</span></button><button data-view="favorites"><span class="icon">★</span>お気に入り</button><button data-view="playlists"><span class="icon">▤</span>プレイリスト</button><button data-view="history"><span class="icon">◷</span>再生履歴</button></nav><div class="navlabel">FOLDERS</div><nav class="nav foldernav" id="folderNav"></nav><button class="databtn" id="newFolder"><span class="icon">＋</span>フォルダを作成</button><div class="sidebarbottom"><div class="navlabel">DATA MANAGEMENT</div><button class="databtn" id="exportYlv"><span class="icon">↓</span><span>.ylv 書き出し</span></button><button class="databtn" id="importYlv"><span class="icon">↑</span><span>.ylv 読み込み</span></button><div class="datahint">ライブラリをバックアップ・復元</div><input id="ylvFile" type="file" accept=".ylv,application/json" hidden><button class="themebutton" id="toggleTheme">☼　ライトテーマに切り替え</button></div></aside>
<main><section class="player"><div class="playerhead"><div><strong id="nowTitle">再生する動画を選択してください</strong><div class="meta" id="nowMeta">選択した動画がここで再生されます</div></div><button class="ghost" id="stopPlayer">閉じる</button></div><div class="playerframe" id="playerFrame"><div class="playerplaceholder"><div style="font-size:38px;color:#ff5964">▶</div><strong>YouTube Player</strong><span>ライブラリから動画を選択</span></div></div></section>
<div class="heading"><div><h1 id="viewTitle">すべての動画</h1><div class="sub" id="viewSub">保存したYouTubeリンクを整理して、いつでも再生</div></div><button id="sortBtn" class="sortbtn">追加が新しい順 ↓</button></div><div id="playlistTools" class="playlistTools" style="display:none"><input id="playlistName" placeholder="新しいプレイリスト名"><button id="createPlaylist" class="primary">＋ 作成</button></div><div class="toolbar"><input id="localSearch" placeholder="この一覧を検索..."><select id="folderFilter"><option value="">すべてのフォルダ</option></select></div><div class="grid" id="videoGrid"></div><div id="empty" class="empty" style="display:none"></div></main></div>
<div class="modalback" id="addModal"><div class="modal"><h2>動画リンクを追加</h2><div class="field"><label>YouTube URL</label><input id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>タイトル（任意）</label><input id="videoTitle" placeholder="空欄なら動画IDをタイトルにします"></div><div class="field"><label>フォルダ</label><select id="videoFolder"></select></div><div class="field"><label>プレイリスト</label><div id="addPlaylistChecks" class="checklist"></div><button id="newPlaylistFromAdd" class="ghost">＋ プレイリストを作成</button></div><div class="notice">保存するのはリンクと管理情報です。動画ファイル自体は保存しません。</div><div class="modalfoot"><button id="cancelAdd">キャンセル</button><button class="primary" id="saveVideo">保存</button></div></div></div>
<div class="modalback" id="editModal"><div class="modal"><h2>動画を管理</h2><div class="field"><label>タイトル</label><input id="editTitle"></div><div class="field"><label>フォルダ</label><select id="editFolder"></select></div><div class="field"><label>プレイリスト（複数選択可）</label><div id="editPlaylistChecks" class="checklist"></div></div><div class="manageactions"><button class="danger" id="deleteFromEdit">動画を削除</button><div class="modalfoot" style="margin:0"><button id="cancelEdit">キャンセル</button><button class="primary" id="saveEdit">変更を保存</button></div></div></div></div>
<script>
(()=>{'use strict';const KEY='ylv_v2',OLD_KEY='ylv_v1',FORMAT='YLV',VERSION=2,DEFAULT=()=>({videos:[],folders:['未分類'],playlists:[],history:[]});const $=id=>document.getElementById(id);let db,view='all',folderView='',sortNewest=true,activePlaylist='',editingId='',theme='dark';
function safeRead(key){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):null}catch{return null}}function normalize(source){const d=source&&typeof source==='object'?source:{};const folders=[...new Set((Array.isArray(d.folders)?d.folders:[]).filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()))];if(!folders.includes('未分類'))folders.unshift('未分類');const videos=(Array.isArray(d.videos)?d.videos:[]).filter(v=>v&&typeof v.id==='string'&&v.id).map(v=>({id:v.id,url:typeof v.url==='string'&&v.url?v.url:'https://www.youtube.com/watch?v='+encodeURIComponent(v.id),title:typeof v.title==='string'&&v.title?v.title:'YouTube動画 '+v.id,folder:typeof v.folder==='string'&&v.folder?v.folder:'未分類',favorite:!!v.favorite,added:Number.isFinite(Number(v.added))?Number(v.added):Date.now()}));videos.forEach(v=>{if(!folders.includes(v.folder))folders.push(v.folder)});const ids=new Set(videos.map(v=>v.id));const playlists=(Array.isArray(d.playlists)?d.playlists:[]).filter(p=>p&&typeof p.name==='string').map((p,i)=>({id:typeof p.id==='string'&&p.id?p.id:'pl-'+i+'-'+Math.random().toString(36).slice(2),name:p.name,videoIds:Array.isArray(p.videoIds)?[...new Set(p.videoIds.filter(id=>typeof id==='string'&&ids.has(id)))]:[]}));const history=(Array.isArray(d.history)?d.history:[]).filter(h=>h&&typeof h.id==='string'&&ids.has(h.id)).map(h=>({id:h.id,time:Number.isFinite(Number(h.time))?Number(h.time):Date.now()}));return{videos,folders,playlists,history}}
const v2raw=safeRead(KEY);if(v2raw!==null){db=normalize(v2raw)}else{db=normalize(safeRead(OLD_KEY)||DEFAULT());try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}function persist(){const serialized=JSON.stringify(db);localStorage.setItem(KEY,serialized);render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parseId(raw){try{const u=new URL(raw);const h=u.hostname.toLowerCase();let id=null;if(h==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0];else if(h==='youtube.com'||h.endsWith('.youtube.com')){if(u.pathname==='/watch')id=u.searchParams.get('v');else if(/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split('/')[2]}return id&&/^[\w-]{6,20}$/.test(id)?id:null}catch{return null}}function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}function setOptions(el,value){el.innerHTML=db.folders.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');if(value&&db.folders.includes(value))el.value=value}function playlistChecks(target,selected=[]){$(target).innerHTML=db.playlists.length?db.playlists.map(p=>`<label class="checkrow"><input type="checkbox" value="${esc(p.id)}" ${selected.includes(p.id)?'checked':''}>${esc(p.name)}<span class="count">${p.videoIds.length}</span></label>`).join(''):'<div class="notice">プレイリストはまだありません。</div>'}function checked(target){return [...$(target).querySelectorAll('input:checked')].map(x=>x.value)}
function fillSelects(){setOptions($('videoFolder'));setOptions($('editFolder'));const old=$('folderFilter').value;$('folderFilter').innerHTML='<option value="">すべてのフォルダ</option>'+db.folders.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');if(db.folders.includes(old))$('folderFilter').value=old}function currentVideos(){let arr=[...db.videos],q=($('globalSearch').value+' '+$('localSearch').value).trim().toLocaleLowerCase();if(view==='favorites')arr=arr.filter(v=>v.favorite);if(view==='history'){const ids=[...new Set(db.history.map(h=>h.id))];arr=ids.map(id=>db.videos.find(v=>v.id===id)).filter(Boolean)}if(view==='folder')arr=arr.filter(v=>v.folder===folderView);if(view==='playlist'){const p=db.playlists.find(x=>x.id===activePlaylist);arr=(p?.videoIds||[]).map(id=>db.videos.find(v=>v.id===id)).filter(Boolean)}if(view==='all'&&$('folderFilter').value)arr=arr.filter(v=>v.folder===$('folderFilter').value);if(q)arr=arr.filter(v=>(v.title+' '+v.id+' '+v.folder).toLocaleLowerCase().includes(q));return arr}
function render(){fillSelects();$('allCount').textContent=db.videos.length;$('folderNav').innerHTML=db.folders.map(f=>`<button data-folder="${esc(f)}" class="${view==='folder'&&folderView===f?'active':''}"><span class="icon">▰</span>${esc(f)}<span class="count">${db.videos.filter(v=>v.folder===f).length}</span></button>`).join('');const titles={all:'すべての動画',favorites:'お気に入り',playlists:'プレイリスト',history:'再生履歴',folder:folderView,playlist:db.playlists.find(p=>p.id===activePlaylist)?.name||'プレイリスト'};$('viewTitle').textContent=titles[view]||'動画';$('viewSub').textContent=view==='history'?'最近再生した動画':view==='playlists'?'プレイリストを作成して動画を整理':view==='playlist'?'登録した動画を管理':view==='favorites'?'お気に入りに登録した動画':'保存したYouTubeリンクを整理して、いつでも再生';$('playlistTools').style.display=view==='playlists'?'flex':'none';$('folderFilter').style.display=view==='all'?'':'none';const arr=currentVideos();if(view==='playlists'){$('videoGrid').innerHTML=db.playlists.map(p=>`<article class="card"><div class="cardbody"><div style="font-size:28px;color:#aab8fa">▤</div><div class="cardtitle">${esc(p.name)}</div><div class="meta">${p.videoIds.length} 本の動画</div><div class="cardactions"><button data-openpl="${esc(p.id)}" class="primary playbtn">開く</button><button data-delpl="${esc(p.id)}" title="プレイリストを削除">削除</button></div></div></article>`).join('');$('empty').style.display=db.playlists.length?'none':'block';$('empty').textContent='プレイリストを作成して、動画をまとめましょう。';return}arr.sort(sortNewest?(a,b)=>b.added-a.added:(a,b)=>a.title.localeCompare(b.title,'ja'));$('videoGrid').innerHTML=arr.map(v=>`<article class="card"><img class="thumb" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="cardbody"><div class="cardtitle" title="${esc(v.title)}">${esc(v.title)}</div><div class="meta">${esc(v.folder)} ・ ${new Date(v.added).toLocaleDateString('ja-JP')}</div><div class="cardactions"><button class="primary playbtn" data-play="${esc(v.id)}">▶ 再生</button><button data-fav="${esc(v.id)}" title="お気に入り">${v.favorite?'★':'☆'}</button><button data-edit="${esc(v.id)}">編集</button></div></div></article>`).join('');$('empty').style.display=arr.length?'none':'block';$('empty').textContent= view==='playlist'?'このプレイリストに動画がありません。「編集」から動画を追加できます。':view==='all'&&db.videos.length===0?'まだ動画がありません。「動画を追加」からYouTubeのURLを保存できます。':'表示できる動画がありません。'}
function play(id){const v=db.videos.find(x=>x.id===id);if(!v)return;$('nowTitle').textContent=v.title;$('nowMeta').textContent='YouTube ・ '+v.id;$('playerFrame').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;db.history.unshift({id,time:Date.now()});db.history=db.history.slice(0,200);try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}function stopPlayer(){$('playerFrame').innerHTML='<div class="playerplaceholder"><div style="font-size:38px;color:#ff5964">▶</div><strong>YouTube Player</strong><span>ライブラリから動画を選択</span></div>';$('nowTitle').textContent='再生する動画を選択してください';$('nowMeta').textContent='選択した動画がここで再生されます'}
function addPlaylist(name){name=name.trim();if(!name)return null;let p=db.playlists.find(x=>x.name.toLocaleLowerCase()===name.toLocaleLowerCase());if(!p){p={id:crypto.randomUUID?crypto.randomUUID():'pl-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,videoIds:[]};db.playlists.push(p)}return p}function addVideo(){const id=parseId($('videoUrl').value.trim());if(!id){alert('有効なYouTube URLを入力してください。');return}if(db.videos.some(v=>v.id===id)){alert('この動画はすでに保存されています。');return}const v={id,url:'https://www.youtube.com/watch?v='+id,title:$('videoTitle').value.trim()||'YouTube動画 '+id,folder:$('videoFolder').value||'未分類',favorite:false,added:Date.now()};db.videos.unshift(v);checked('addPlaylistChecks').forEach(pid=>{const p=db.playlists.find(x=>x.id===pid);if(p&&!p.videoIds.includes(id))p.videoIds.push(id)});$('videoUrl').value='';$('videoTitle').value='';closeModal('addModal');try{persist()}catch(e){db.videos=db.videos.filter(x=>x.id!==id);db.playlists.forEach(p=>p.videoIds=p.videoIds.filter(x=>x!==id));alert('保存できませんでした。ブラウザーの保存領域を確認してください。')}}function editVideo(id){const v=db.videos.find(x=>x.id===id);if(!v)return;editingId=id;$('editTitle').value=v.title;setOptions($('editFolder'),v.folder);playlistChecks('editPlaylistChecks',db.playlists.filter(p=>p.videoIds.includes(id)).map(p=>p.id));openModal('editModal')}function saveEdit(){const v=db.videos.find(x=>x.id===editingId);if(!v)return;const old={title:v.title,folder:v.folder,pls:db.playlists.map(p=>[p,p.videoIds.slice()])};v.title=$('editTitle').value.trim()||v.title;v.folder=$('editFolder').value;const selected=new Set(checked('editPlaylistChecks'));db.playlists.forEach(p=>{p.videoIds=p.videoIds.filter(id=>id!==editingId);if(selected.has(p.id))p.videoIds.push(editingId)});try{persist();closeModal('editModal')}catch(e){v.title=old.title;v.folder=old.folder;old.pls.forEach(([p,ids])=>p.videoIds=ids);alert('保存できませんでした。変更は適用されていません。')}}function deleteVideo(id){if(!confirm('この動画をライブラリから削除しますか？関連するプレイリストからも外れます。'))return;const videos=db.videos.slice(),playlists=db.playlists.map(p=>[p,p.videoIds.slice()]),history=db.history.slice();db.videos=db.videos.filter(v=>v.id!==id);db.playlists.forEach(p=>p.videoIds=p.videoIds.filter(x=>x!==id));db.history=db.history.filter(h=>h.id!==id);try{persist();closeModal('editModal')}catch(e){db.videos=videos;playlists.forEach(([p,ids])=>p.videoIds=ids);db.history=history;alert('削除を保存できませんでした。データは元に戻しました。')}}
function validateBackup(x){if(!x||typeof x!=='object'||x.format!==FORMAT||x.version!==VERSION||!x.data||typeof x.data!=='object')return false;const d=x.data;if(!Array.isArray(d.videos)||!Array.isArray(d.folders)||!Array.isArray(d.playlists)||!Array.isArray(d.history))return false;if(!d.folders.every(f=>typeof f==='string'))return false;if(!d.videos.every(v=>v&&typeof v.id==='string'&&typeof v.url==='string'&&typeof v.title==='string'&&typeof v.folder==='string'&&typeof v.favorite==='boolean'&&Number.isFinite(v.added)))return false;if(new Set(d.videos.map(v=>v.id)).size!==d.videos.length)return false;if(!d.playlists.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.videoIds)&&p.videoIds.every(id=>typeof id==='string')))return false;if(!d.history.every(h=>h&&typeof h.id==='string'&&Number.isFinite(h.time)))return false;const ids=new Set(d.videos.map(v=>v.id));if(d.playlists.some(p=>p.videoIds.some(id=>!ids.has(id)))||d.history.some(h=>!ids.has(h.id)))return false;return true}function exportYlv(){const payload={format:FORMAT,version:VERSION,exported_at:new Date().toISOString(),data:db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='YLV_Backup_'+new Date().toISOString().slice(0,10)+'.ylv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importYlv(e){const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validateBackup(parsed)){alert('このファイルは有効なYLV v2バックアップではありません。現在のデータは変更されていません。');return}const next=normalize(parsed.data);if(!confirm('現在のライブラリを完全に置き換えます。\n\n動画：'+next.videos.length+'本\nフォルダ：'+next.folders.length+'個\nプレイリスト：'+next.playlists.length+'個\n履歴：'+next.history.length+'件\n\nこの内容でReplaceしますか？'))return;const serialized=JSON.stringify(next);localStorage.setItem(KEY,serialized);db=next;view='all';folderView='';activePlaylist='';$('globalSearch').value='';$('localSearch').value='';stopPlayer();render();alert('YLV v2を読み込みました。')}catch(err){alert('読み込みに失敗しました。保存領域またはファイルを確認してください。現在のデータは維持されています。')}finally{e.target.value=''}}
$('openAdd').onclick=()=>{setOptions($('videoFolder'));playlistChecks('addPlaylistChecks');openModal('addModal');$('videoUrl').focus()};$('cancelAdd').onclick=()=>closeModal('addModal');$('saveVideo').onclick=addVideo;$('addModal').addEventListener('click',e=>{if(e.target===$('addModal'))closeModal('addModal')});$('newPlaylistFromAdd').onclick=()=>{const name=prompt('新しいプレイリスト名');if(!name?.trim())return;const p=addPlaylist(name);playlistChecks('addPlaylistChecks',[p.id]);try{persist()}catch{db.playlists=db.playlists.filter(x=>x!==p);alert('プレイリストを保存できませんでした.')}};$('videoGrid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.openpl){view='playlist';activePlaylist=b.dataset.openpl;render();return}if(b.dataset.delpl){if(confirm('このプレイリストを削除しますか？動画自体はライブラリに残ります。')){db.playlists=db.playlists.filter(p=>p.id!==b.dataset.delpl);try{persist()}catch{alert('削除を保存できませんでした。')}}return}if(b.dataset.play){play(b.dataset.play);return}if(b.dataset.fav){const v=db.videos.find(x=>x.id===b.dataset.fav);if(v){v.favorite=!v.favorite;try{persist()}catch{v.favorite=!v.favorite;alert('変更を保存できませんでした。')}}return}if(b.dataset.edit)editVideo(b.dataset.edit)});$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;folderView='';activePlaylist='';document.querySelectorAll('#nav [data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});$('folderNav').addEventListener('click',e=>{const b=e.target.closest('[data-folder]');if(!b)return;view='folder';folderView=b.dataset.folder;activePlaylist='';document.querySelectorAll('#nav [data-view]').forEach(x=>x.classList.remove('active'));render()});$('newFolder').onclick=()=>{const name=prompt('フォルダ名');if(!name?.trim())return;const n=name.trim();if(db.folders.includes(n)){alert('同じ名前のフォルダがあります。');return}db.folders.push(n);try{persist()}catch{db.folders.pop();alert('フォルダを保存できませんでした。')}};$('createPlaylist').onclick=()=>{const p=addPlaylist($('playlistName').value);if(!p)return;$('playlistName').value='';try{persist()}catch{db.playlists=db.playlists.filter(x=>x!==p);alert('プレイリストを保存できませんでした。')}};$('sortBtn').onclick=()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'追加が新しい順 ↓':'タイトル順 A→Z';render()};$('globalSearch').oninput=render;$('localSearch').oninput=render;$('folderFilter').onchange=render;$('stopPlayer').onclick=stopPlayer;$('cancelEdit').onclick=()=>closeModal('editModal');$('saveEdit').onclick=saveEdit;$('deleteFromEdit').onclick=()=>deleteVideo(editingId);$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeModal('editModal')});$('exportYlv').onclick=exportYlv;$('importYlv').onclick=()=>$('ylvFile').click();$('ylvFile').addEventListener('change',importYlv);$('toggleTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('light',theme==='light');$('toggleTheme').textContent=theme==='dark'?'☼　ライトテーマに切り替え':'☾　ダークテーマに切り替え'};window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('addModal');closeModal('editModal')}});render();
})();
